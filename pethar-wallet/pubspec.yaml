name: pethar_mobile
description: Péthar (ဖေ့သာ) — Native Android & iOS Mobile Financial App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # ── State Management ──
  provider: ^6.1.2

  # ── Localization ──
  intl: ^0.20.3

  # ── Supabase (Backend) ──
  supabase_flutter: ^2.18.2

  # ── Local Encrypted Storage ──
  flutter_secure_storage: ^9.2.4

  # ── Cryptography ──
  # Ed25519 signatures for offline vouchers
  cryptography: ^2.7.0
  crypto: ^3.0.6

  # ── Utilities ──
  path_provider: ^2.1.2
  shared_preferences: ^2.3.4
  image_picker: ^1.2.4
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
