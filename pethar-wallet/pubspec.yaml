name: pethar_mobile
description: Péthar (ဖေ့သာ) — Native Android & iOS Mobile Financial App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0

  # ── State Management ──
  provider: ^6.1.2

  # ── Localization ──
  intl: ^0.20.3

  # ── Supabase (Backend) ──
  supabase_flutter: ^2.18.2

  # ── Local Encrypted Storage ──
  # SQLCipher-backed SQLite for data-at-rest encryption
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

  # ── Cryptography ──
  # Ed25519 signatures for offline vouchers
  cryptography: ^2.7.0

  # ── Networking ──
  connectivity_plus: ^6.1.3
  http: ^1.3.0

  # ── Utilities ──
  path_provider: ^2.1.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
