<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Péthar" />
    <!-- New White & Crimson 3D Péthar Logo & Favicon (Active across all browsers with cache-busting) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/pethar-logo-red-white.svg?v=20261017-2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261017-2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20261017-2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=20261017-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261017-2" />
    <!-- Previous Favicons & Touch Icons Preserved in /public/previous-* (not dropped) -->
    <title>Péthar — Your Everyday Digital Wallet</title>
    <meta name="description" content="Péthar: Your Everyday Digital Wallet. Manage your balance effortlessly in one mobile app. Convert at a fixed 1 Arakan Dollar = 1 US Dollar rate, send to any Péthar user instantly for free, and withdraw anytime." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Geist:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Geist:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&family=Geist:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      window.__petharDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__petharDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pethar-install-ready'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body class="bg-[#09090B] text-white antialiased font-sans selection:bg-white selection:text-[#09090B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
